<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block;width:1600px;height:1000px}</style>
</head><body><canvas id="c"></canvas>
<script>
// Pip's Island: art direction concept renderer. One hand-composed scene, four lighting moods.
// Open with #golden, #mist, #dusk or #rain.
const W = 1600, H = 1000; let K = window.LAB ? 1.25 : 2;
const cv = document.getElementById('c'); cv.width = W*K; cv.height = H*K;
const main = cv.getContext('2d');
let g = main;

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hx = h => { h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const css = (c,a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mixc = (a,b,t) => { const A = hx(a), B = hx(b); return [A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t]; };
const mix = (a,b,t,al=1) => css(mixc(a,b,Math.max(0,Math.min(1,t))), al);
const mixHex = (a,b,t) => '#' + mixc(a,b,Math.max(0,Math.min(1,t))).map(v => Math.round(v).toString(16).padStart(2,'0')).join('');

const STYLES = {
  golden: {
    L: {x:-0.72, y:-0.69}, key:'#ffe2a6', keyAmt:0.55, shade:'#4a4c86', shadeAmt:0.5,
    rimAll: {dx:-0.72, dy:-0.69, c:'#ffd88a', a:0.55},
    sun: {dx:0.95, dy:0.31, len:1.15, alpha:0.5, blur:4, color:'#2b2452'},
    ao: {alpha:0.42, blur:5},
    grass:'#9db967', dirt:'#d9bf8c', sea:['#2f6f80','#8cc6bf'], cliff:['#c09e74','#7c6450'],
    refl:['#ffcf8c','#5f9ea6'], bark:'#7a573c',
    greens:['#6f9a4c','#7ea654','#5f8c48','#86ad5a'], pine:'#4f7d4c',
    grade:[{m:'soft-light',c:'#ff9a48',a:0.38},{m:'multiply',c:'#fbe0c0',a:0.3}],
    fog:null,
    dof:null, vig:0.42, grain:0.07,
    fgShade:'#2a2a45', fgAmt:0.45,
  },
  mist: {
    L: {x:0.55, y:-0.83}, key:'#f3f6f0', keyAmt:0.38, shade:'#55727a', shadeAmt:0.45,
    sun: {dx:-0.62, dy:0.42, len:0.45, alpha:0.24, blur:12, color:'#23383c'},
    ao: {alpha:0.38, blur:8},
    grass:'#83a587', dirt:'#c4bba7', sea:['#5d8c94','#a5c4c4'], cliff:['#9d978b','#6b665d'],
    refl:['#e6eeec','#94b6b8'], bark:'#6b5644',
    greens:['#5f8a6c','#6c9676','#557f63','#7aa080'], pine:'#456e5c',
    grade:[{m:'saturation',c:'#808080',a:0.25},{m:'screen',c:'#7f99a1',a:0.1},{m:'multiply',c:'#c9d6d4',a:0.35}],
    fog:{c:'#e2eae9', top:0.72, mid:0.6, midA:0.07, bot:0.02},
    groundFog:true, shafts:true,
    dof:null, vig:0.32, grain:0.06,
    fgShade:'#2c3d3d', fgAmt:0.35,
  },
  dusk: {
    L: {x:0.25, y:-0.97}, key:'#ffffff', keyAmt:0.25, shade:'#363e6e', shadeAmt:0.55,
    sun: {dx:0.55, dy:0.55, len:0.4, alpha:0.22, blur:9, color:'#151a33'},
    ao: {alpha:0.48, blur:6},
    grass:'#8db66e', dirt:'#c9b48a', sea:['#2f5f7f','#77aac0'], cliff:['#b89a75','#73604f'],
    refl:['#f6a179','#5966a0'], bark:'#7a573c',
    greens:['#6c9a4f','#79a557','#5d8b4a','#84ad5d'], pine:'#4f7d4c',
    grade:[{m:'multiply',c:'#56639c',a:1},{m:'multiply',c:'#cdc0e2',a:0.4}],
    fog:null,
    lights:true, pipRim:{dx:0.95, dy:-0.3, c:'#ffc27a', a:0.9},
    dof:null, vig:0.55, grain:0.08,
    fgShade:'#0e1226', fgAmt:0.82,
  },
  rain: {
    L: {x:-0.1, y:-0.99}, key:'#eef5f4', keyAmt:0.3, shade:'#34474a', shadeAmt:0.42,
    sun: {dx:0, dy:0, len:0, alpha:0, blur:0, color:'#000000'},
    ao: {alpha:0.55, blur:7},
    grass:'#5e9a52', dirt:'#8c7558', sea:['#2f5c62','#759f9c'], cliff:['#8b8071','#575046'],
    refl:['#cfd8d8','#6f8f90'], bark:'#5c4433',
    greens:['#3f7d45','#4c8a4c','#356f3d','#58955a'], pine:'#356a48',
    grade:[{m:'saturation',c:'#808080',a:0.14},{m:'multiply',c:'#a7b6b3',a:0.55}],
    fog:{c:'#9db0b1', top:0.55, mid:0.55, midA:0.06, bot:0},
    wet:true, rain:true,
    dof:null, vig:0.45, grain:0.07,
    fgShade:'#16261f', fgAmt:0.6,
  },
};
const clone = o => JSON.parse(JSON.stringify(o));
let S = clone(STYLES[(location.hash || '#golden').slice(1)] || STYLES.golden);

// ---------- shading primitives ----------
const lit = (base,t) => t >= 0 ? mix(base, S.key, t*S.keyAmt) : mix(base, S.shade, -t*S.shadeAmt);
const litHex = (base,t) => t >= 0 ? mixHex(base, S.key, t*S.keyAmt) : mixHex(base, S.shade, -t*S.shadeAmt);
function circ(x,y,r,f){ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fillStyle=f; g.fill(); }
function ell(x,y,rx,ry,f,rot=0){ g.beginPath(); g.ellipse(x,y,rx,ry,rot,0,Math.PI*2); g.fillStyle=f; g.fill(); }
function sphere(x,y,r,base,o={}){
  const sq = o.sq || 1, L = S.L;
  g.save(); g.translate(x,y); g.scale(1,sq);
  const hX = L.x*r*0.42, hY = L.y*r*0.42 - r*0.1;
  const gr = g.createRadialGradient(hX,hY,r*0.04, -L.x*r*0.18, -L.y*r*0.18 + r*0.08, r*1.15);
  const k = o.soft ? 0.7 : 1;
  gr.addColorStop(0, lit(base, k)); gr.addColorStop(0.5, base); gr.addColorStop(1, lit(base, -k));
  g.fillStyle = gr; g.beginPath(); g.arc(0,0,r,0,Math.PI*2); g.fill();
  const rim = o.rim || (o.noRim ? null : S.rimAll);
  if (rim) {
    g.save(); g.beginPath(); g.arc(0,0,r,0,Math.PI*2); g.clip();
    g.beginPath(); g.arc(0,0,r,0,Math.PI*2); g.arc(-rim.dx*r*0.17, -rim.dy*r*0.17, r, 0, Math.PI*2);
    g.fillStyle = css(hx(rim.c), rim.a); g.fill('evenodd'); g.restore();
  }
  if (S.wet && !o.noWet && !o.soft) { g.fillStyle='rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(hX*0.85, hY*0.85, r*0.18, r*0.07, -0.45, 0, Math.PI*2); g.fill(); }
  g.restore();
}
function cyl(x,y,r,h,base,taper=0.88){
  const left = S.L.x <= 0 ? 1 : -1;
  const gr = g.createLinearGradient(x-r,0,x+r,0);
  gr.addColorStop(0, lit(base, 0.9*left)); gr.addColorStop(0.42, base); gr.addColorStop(1, lit(base, -0.95*left));
  g.fillStyle = gr; g.beginPath(); g.moveTo(x-r,y); g.lineTo(x-r*taper,y-h); g.lineTo(x+r*taper,y-h); g.lineTo(x+r,y); g.ellipse(x,y,r,r*0.35,0,0,Math.PI); g.closePath(); g.fill();
}
function blobPath(c, cx, cy, rx, ry, n){
  const pts = n.map((v,i) => { const a = i/n.length*Math.PI*2, k = 1 + v; return [cx+Math.cos(a)*rx*k, cy+Math.sin(a)*ry*k]; });
  const mid = (a,b) => [(a[0]+b[0])/2,(a[1]+b[1])/2];
  c.beginPath(); let m = mid(pts[pts.length-1], pts[0]); c.moveTo(m[0],m[1]);
  for (let i=0;i<pts.length;i++){ const nx = mid(pts[i], pts[(i+1)%pts.length]); c.quadraticCurveTo(pts[i][0], pts[i][1], nx[0], nx[1]); }
  c.closePath();
}
function smoothPath(c, pts, dx=0, dy=0){
  const mid = (a,b) => [(a[0]+b[0])/2+dx,(a[1]+b[1])/2+dy];
  c.beginPath(); let m = mid(pts[pts.length-1], pts[0]); c.moveTo(m[0],m[1]);
  for (let i=0;i<pts.length;i++){ const nx = mid(pts[i], pts[(i+1)%pts.length]); c.quadraticCurveTo(pts[i][0]+dx, pts[i][1]+dy, nx[0], nx[1]); }
  c.closePath();
}

// ---------- shadow + ambient occlusion layers ----------
const mk = () => { const c = document.createElement('canvas'); c.width = W*K; c.height = H*K; const x = c.getContext('2d'); x.setTransform(K,0,0,K,0,0); return [c,x]; };
let shC, shg, aoC, aog;
function castColumn(x,y,h,w){ if (!S.sun.alpha) return; const L = S.sun.len; shg.lineCap='round'; shg.strokeStyle='#000'; shg.lineWidth=w; shg.beginPath(); shg.moveTo(x,y); shg.lineTo(x+S.sun.dx*h*L, y+S.sun.dy*h*L); shg.stroke(); }
function castBlob(x,y,h,r){ if (!S.sun.alpha) return; const L = S.sun.len; const cx = x+S.sun.dx*h*L, cy = y+S.sun.dy*h*L, a = Math.atan2(S.sun.dy, S.sun.dx);
  shg.save(); shg.translate(cx,cy); shg.rotate(a); shg.beginPath(); shg.ellipse(0,0,r*(1+L*0.3), r*0.6, 0, 0, Math.PI*2); shg.fillStyle='#000'; shg.fill(); shg.restore(); }
function ao(x,y,r,a=1){ aog.save(); aog.translate(x,y); aog.scale(1,0.42); const gr = aog.createRadialGradient(0,0,0,0,0,r); gr.addColorStop(0,`rgba(0,0,0,${a})`); gr.addColorStop(1,'rgba(0,0,0,0)'); aog.fillStyle=gr; aog.beginPath(); aog.arc(0,0,r,0,Math.PI*2); aog.fill(); aog.restore(); }
function tint(c, col){ const x = c.getContext('2d'); x.save(); x.setTransform(1,0,0,1,0,0); x.globalCompositeOperation='source-in'; x.fillStyle=col; x.fillRect(0,0,c.width,c.height); x.restore(); }
function layer(c, blur, alpha){ main.save(); main.setTransform(1,0,0,1,0,0); main.filter = `blur(${blur*K}px)`; main.globalAlpha = alpha; main.drawImage(c,0,0); main.restore(); }

// ---------- scene layout ----------
const ISLAND = [[-200,-200],[1800,-200],[1800,1250],[800,1250],[650,1030],[520,935],[380,862],[230,792],[90,705],[-60,645],[-220,628]];
const CLIFF_H = 74;
const POND = { x:1215, y:525, rx:182, ry:96 };
const BIG = { x:760, y:470 };
const HOUSE = { x:388, y:568 };
const PIP = { x:935, y:735 };
const LANTERN = { x:1042, y:705 };
const PATHS = [ [[820,1060],[838,790],[790,575]], [[792,650],[640,615],[465,624]], [[810,648],[960,610],[1050,592]] ];
const TREES = [
  {x:120,y:262,s:1.0,k:'round'},{x:300,y:190,s:0.95,k:'pine'},{x:470,y:150,s:1.1,k:'round'},{x:612,y:100,s:0.9,k:'pine'},
  {x:1005,y:128,s:1.0,k:'round'},{x:1150,y:92,s:0.85,k:'pine'},{x:1385,y:160,s:1.1,k:'round'},{x:1565,y:250,s:1.0,k:'pine'},
  {x:1525,y:430,s:0.95,k:'round'},{x:1490,y:790,s:1.15,k:'round'},{x:228,y:430,s:0.85,k:'pine'},{x:575,y:338,s:0.8,k:'round'},
  {x:1068,y:312,s:0.82,k:'pine'},{x:1280,y:300,s:0.75,k:'round'},{x:60,y:470,s:0.9,k:'round'},
].map((t,i) => ({...t, seed:11+i*7, i}));
const ROCKS = [[300,768,26],[452,858,20],[1322,890,24],[150,668,18],[1180,960,16]];
const MUSH = [[862,772,1],[884,786,0.78],[1112,822,1.1],[640,880,0.9]];
const TUFTS = [[702,808],[1185,700],[522,712],[1452,612],[300,646],[1002,952],[1350,760],[600,520]];
const FLOWERS = [[620,768],[1055,866],[560,455],[985,430],[1402,705],[250,566],[1240,820],[880,880]];
const DUCKS = [[1175,545,1,-1,true],[1226,553,0.58,-1,false],[1263,561,0.58,-1,false],[1300,556,0.58,-1,false]];

// ---------- ground ----------
function sea(){
  const gr = g.createLinearGradient(0,600,700,1000); gr.addColorStop(0,S.sea[0]); gr.addColorStop(1,mixHex(S.sea[0],S.sea[1],0.4));
  g.fillStyle = gr; g.fillRect(0,0,W,H);
  g.save(); g.filter = `blur(${26}px)`; g.strokeStyle = S.sea[1]; g.lineWidth = 140; smoothPath(g, ISLAND, 0, CLIFF_H+10); g.stroke(); g.restore();
  const R = rng(3); g.strokeStyle = css(hx(S.sea[1]), 0.45); g.lineWidth = 2; g.lineCap = 'round';
  for (let i=0;i<120;i++){ const x = R()*700, y = 560 + R()*440; g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+10,y-4,x+22,y); g.stroke(); }
  // offshore rock with its own cliff
  const n = [0.1,-0.15,0.2,-0.05,0.12,-0.2,0.08];
  for (let i=26;i>=0;i-=2){ g.fillStyle = mix(S.cliff[0], S.cliff[1], i/26); blobPath(g, 170, 880+i, 58, 30, n); g.fill(); }
  g.fillStyle = lit(mixHex(S.cliff[0], S.grass, 0.25), 0.3); blobPath(g, 170, 880, 58, 30, n); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3; blobPath(g, 170, 910, 64, 34, n); g.stroke();
}
function island(){
  for (let i=CLIFF_H; i>=0; i-=2){ const t = i/CLIFF_H, band = Math.floor(i/11)%2 ? 0.13 : 0;
    g.fillStyle = mix(S.cliff[0], S.cliff[1], Math.min(1, t+band)); smoothPath(g, ISLAND, 0, i); g.fill(); }
  // foam at the foot of the cliff
  g.save(); g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 6; smoothPath(g, ISLAND, 0, CLIFF_H+6); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = 3; smoothPath(g, ISLAND, 0, CLIFF_H+18); g.stroke(); g.restore();
  // grassy top with a lit lip
  g.fillStyle = lit(S.grass, -0.35); smoothPath(g, ISLAND, 0, 4); g.fill();
  g.fillStyle = S.grass; smoothPath(g, ISLAND); g.fill();
  g.save(); smoothPath(g, ISLAND); g.clip();
  // rolling ground: soft bumps lit from one side
  const R = rng(9);
  for (let i=0;i<30;i++){ const x = R()*W, y = R()*H, r = 120 + R()*200;
    const a = g.createRadialGradient(x+S.L.x*r*0.35, y+S.L.y*r*0.35, 0, x, y, r);
    a.addColorStop(0, lit(S.grass, 0.5).replace(',1)', ',.22)')); a.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = a; g.fillRect(x-r,y-r,2*r,2*r);
    const b = g.createRadialGradient(x-S.L.x*r*0.5, y-S.L.y*r*0.5, 0, x-S.L.x*r*0.3, y-S.L.y*r*0.3, r*0.8);
    b.addColorStop(0, lit(S.grass, -0.6).replace(',1)', ',.13)')); b.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = b; g.fillRect(x-r*1.5,y-r*1.5,3*r,3*r); }
  // grass blades
  for (let i=0;i<4200;i++){ const x = R()*W, y = R()*H, l = 5 + R()*6, t = R()*2-1, lean = (R()-0.5)*4;
    g.strokeStyle = lit(S.grass, t*0.42); g.lineWidth = 1.1; g.beginPath(); g.moveTo(x,y); g.lineTo(x+lean, y-l); g.stroke(); }
  g.restore();
  // lit edge where the grass meets the cliff
  g.save(); g.strokeStyle = lit(S.grass, 0.9); g.lineWidth = 3; smoothPath(g, ISLAND); g.stroke(); g.restore();
}
function paths(){
  g.lineCap='round'; g.lineJoin='round';
  const stroke = (w, col, dx=0, dy=0) => { g.strokeStyle = col; g.lineWidth = w; for (const [a,c,b] of PATHS){ g.beginPath(); g.moveTo(a[0]+dx,a[1]+dy); g.quadraticCurveTo(c[0]+dx,c[1]+dy,b[0]+dx,b[1]+dy); g.stroke(); } };
  stroke(66, lit(S.grass, -0.7));
  stroke(56, S.dirt);
  stroke(30, lit(S.dirt, 0.6).replace(',1)', ',.5)'), S.L.x*5, S.L.y*5);
  const R = rng(21);
  for (const [a,c,b] of PATHS) for (let i=0;i<80;i++){ const t = R(), u = 1-t;
    const x = u*u*a[0]+2*u*t*c[0]+t*t*b[0] + (R()-0.5)*44, y = u*u*a[1]+2*u*t*c[1]+t*t*b[1] + (R()-0.5)*44;
    sphere(x, y, 1.8 + R()*2.2, mixHex(S.dirt, '#8a7a66', 0.5), {sq:0.6, noRim:true, noWet:true}); }
  if (S.wet) {
    for (const [x,y,rx,ry] of [[828,880,46,15],[804,700,30,10],[700,628,34,11],[930,618,26,9]]) {
      ell(x, y+2, rx+4, ry+3, mixHex(S.dirt, '#3a2e22', 0.4));
      const gr = g.createLinearGradient(0,y-ry,0,y+ry); gr.addColorStop(0, S.refl[0]); gr.addColorStop(1, S.refl[1]);
      ell(x, y, rx, ry, gr);
      g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=1.2; const R2 = rng(x);
      for (let k=0;k<3;k++){ const px = x+(R2()-0.5)*rx, py = y+(R2()-0.5)*ry*0.8, pr = 3+R2()*7; g.beginPath(); g.ellipse(px,py,pr,pr*0.35,0,0,Math.PI*2); g.stroke(); }
    }
  }
}
function pond(){
  const p = POND;
  ell(p.x, p.y+6, p.rx+22, p.ry+16, lit(S.grass, -0.9));
  ell(p.x, p.y, p.rx+10, p.ry+8, mixHex(S.dirt, '#5d4a37', 0.55));
  g.save(); g.beginPath(); g.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, Math.PI*2); g.clip();
  const gr = g.createLinearGradient(0, p.y-p.ry, 0, p.y+p.ry); gr.addColorStop(0, S.refl[0]); gr.addColorStop(1, S.refl[1]);
  g.fillStyle = gr; g.fillRect(p.x-p.rx, p.y-p.ry, p.rx*2, p.ry*2);
  // reflection of the trees and reeds along the far bank
  for (let i=0;i<9;i++){ ell(p.x-p.rx+40+i*42, p.y-p.ry+8, 36, 26, css(hx(S.greens[i%4]), 0.35)); }
  // the far bank shades the water on the side facing the light
  g.beginPath(); g.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, Math.PI*2); g.ellipse(p.x - S.L.x*-16, p.y - S.L.y*-14, p.rx, p.ry, 0, 0, Math.PI*2);
  g.fillStyle = 'rgba(20,30,40,.32)'; g.fill('evenodd');
  g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = 1.6;
  const R = rng(5);
  for (let i=0;i<(S.rain ? 34 : 9);i++){ const x = p.x+(R()-0.5)*p.rx*1.6, y = p.y+(R()-0.5)*p.ry*1.5, r = 4+R()*(S.rain?12:20); g.beginPath(); g.ellipse(x,y,r,r*0.38,0,0,Math.PI*2); g.stroke(); }
  if (!S.rain) { g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2.2; for (let i=0;i<5;i++){ g.beginPath(); g.moveTo(p.x-60+i*24, p.y+30+i*6); g.lineTo(p.x-30+i*24, p.y+30+i*6); g.stroke(); } }
  g.restore();
  for (const [dx,dy,r] of [[-120,-10,22],[95,28,20],[40,-48,17],[-40,52,15]]) {
    sphere(p.x+dx, p.y+dy, r, '#6f9e55', {sq:0.42, noRim:true});
    g.save(); g.translate(p.x+dx, p.y+dy); g.fillStyle = S.refl[1]; g.beginPath(); g.moveTo(0,0); g.arc(0,0,r*1.05,-0.25,0.25); g.closePath(); g.scale(1,0.42); g.restore();
  }
  sphere(p.x+40, p.y-52, 4.5, '#f6c6d0', {noRim:true});
  g.strokeStyle = lit(S.grass, 0.8); g.lineWidth = 2.5; g.beginPath(); g.ellipse(p.x, p.y+4, p.rx+20, p.ry+14, 0, Math.PI*0.15, Math.PI*0.85); g.stroke();
}
function decor(){
  const R = rng(41);

function canopy(cx, cy, cr, col, seed, clumps, B){
  ell(cx, cy+cr*0.48, cr*0.88, cr*0.32, mixHex(col, '#1a2618', 0.5));
  for (const [bx,by,br] of B) {
    const facing = (bx*S.L.x + by*S.L.y) / (Math.hypot(bx,by) || 1);
    sphere(cx+bx*cr, cy+by*cr, br*cr, col, {soft:true, noRim: !(facing > 0.35 && Math.hypot(bx,by) > 0.3)});
  }
  const R = rng(seed);
  for (let i=0;i<clumps;i++){ const a = Math.atan2(S.L.y, S.L.x) + (R()-0.5)*1.8, d = cr*(0.25+R()*0.45);
    sphere(cx+Math.cos(a)*d, cy+Math.sin(a)*d*0.85, cr*(0.17+R()*0.08), mixHex(col, '#d2e69a', 0.16), {soft:true, noRim:true}); }
}
function pineTree(t){

  for (const [dy,w,h] of tiers){ const by = y+dy*s, tw = w*s, th = h*s*1.5;

// ---------- shadows for everything that stands up ----------
function buildShadows(){
  for (const t of TREES) { const s = t.s;
    if (t.k==='pine') { castColumn(t.x, t.y, 70*s, 14*s); castBlob(t.x, t.y, 64*s, 34*s); ao(t.x, t.y, 46*s, 0.9); }
    else { castColumn(t.x, t.y, 82*s, 20*s); castBlob(t.x, t.y, 82*s, 50*s); ao(t.x, t.y, 60*s, 0.95); } }
  castColumn(BIG.x, BIG.y, 200, 70); castBlob(BIG.x, BIG.y, 210, 150); ao(BIG.x, BIG.y, 130, 1); ao(BIG.x, BIG.y+40, 220, 0.5);
  castColumn(HOUSE.x, HOUSE.y, 90, 100); castBlob(HOUSE.x, HOUSE.y, 70, 60); ao(HOUSE.x, HOUSE.y, 90, 1);
  castColumn(LANTERN.x, LANTERN.y, 72, 6); castBlob(LANTERN.x-14, LANTERN.y, 60, 12); ao(LANTERN.x, LANTERN.y, 16, 0.8);
  if (!window.SKIP_DYN) { castColumn(PIP.x, PIP.y, 60, 34); castBlob(PIP.x+8, PIP.y, 80, 24); ao(PIP.x, PIP.y, 44, 1); }
  for (const r of ROCKS) { castBlob(r[0], r[1], r[2]*0.6, r[2]); ao(r[0], r[1], r[2]*1.5, 0.9); }
  for (const m of MUSH) { castColumn(m[0], m[1], 14*m[2], 8*m[2]); ao(m[0], m[1], 14*m[2], 0.8); }
  ao(POND.x, POND.y-POND.ry, POND.rx*0.9, 0.35);
}

}
function foreground(){
  // big out-of-focus leaves in the corners frame the scene like a diorama
  const tmp = document.createElement('canvas'); tmp.width = cv.width; tmp.height = cv.height; const t = tmp.getContext('2d'); t.setTransform(K,0,0,K,0,0);
  const prev = g; g = t;
  const col = mixHex('#4f7d45', S.fgShade, S.fgAmt);
  for (const [x,y,r] of [[1560,1010,120],[1450,1060,100],[1640,880,90],[1330,1080,70]]) sphere(x, y, r, col, {noRim:true, noWet:true});
  for (const [x,y,r] of [[-40,-30,110],[90,-60,90],[-70,110,80]]) sphere(x, y, r, mixHex(col, '#000000', 0.15), {noRim:true, noWet:true});
  g = prev;
  main.save(); main.setTransform(1,0,0,1,0,0); main.filter = `blur(${7*K}px)`; main.drawImage(tmp,0,0); main.restore();
}
function vignetteAndGrain(){
  const gr = g.createRadialGradient(W/2, H*0.55, W*0.32, W/2, H*0.55, W*0.78);
  gr.addColorStop(0, 'rgba(12,10,24,0)'); gr.addColorStop(1, `rgba(12,10,24,${S.vig})`);
  if (!window.SKIP_DYN) { g.fillStyle = gr; g.fillRect(0,0,W,H); }
  const n = document.createElement('canvas'); n.width = n.height = 256; const nx = n.getContext('2d'), id = nx.createImageData(256,256), R = rng(5);
  for (let i=0;i<id.data.length;i+=4){ const v = 110 + R()*90; id.data[i]=v; id.data[i+1]=v; id.data[i+2]=v; id.data[i+3]=255; }
  nx.putImageData(id,0,0);
  main.save(); main.setTransform(1,0,0,1,0,0); main.globalCompositeOperation = 'overlay'; main.globalAlpha = S.grain; main.fillStyle = main.createPattern(n,'repeat'); main.fillRect(0,0,cv.width,cv.height); main.restore();
}

// ---------- render ----------
function renderAll(){
cv.width = W*K; cv.height = H*K; [shC, shg] = mk(); [aoC, aog] = mk(); g = main;
main.setTransform(K,0,0,K,0,0);
sea(); island(); paths(); decor(); pond();
buildShadows();
tint(shC, S.sun.color); tint(aoC, '#141a16');
if (S.sun.alpha) layer(shC, S.sun.blur, S.sun.alpha);
layer(aoC, S.ao.blur, S.ao.alpha);
const objs = [];
if (!window.SKIP_OBJ) TREES.forEach(t => objs.push({y:t.y, f:() => t.k==='pine' ? pineTree(t) : roundTree(t)}));
if (!window.SKIP_OBJ) objs.push({y:BIG.y, f:bigTree}, {y:HOUSE.y, f:house}, {y:LANTERN.y, f:lantern});
if (!window.SKIP_DYN) objs.push({y:PIP.y, f:pip});
if (!window.SKIP_OBJ) ROCKS.forEach(r => objs.push({y:r[1], f:() => rock(r)}));
if (!window.SKIP_OBJ) MUSH.forEach(m => objs.push({y:m[1], f:() => mushroom(m)}));
for (let i=0;i<20;i++){ const a = Math.PI*(1.08 + i/19*0.84), x = POND.x+Math.cos(a)*(POND.rx+8), y = POND.y+Math.sin(a)*(POND.ry+6); objs.push({y, f:() => reed(x, y, (i*37%10)/10)}); }
if (!window.SKIP_DYN) DUCKS.forEach(d => objs.push({y:d[1], f:() => duck(d)}));
objs.sort((a,b) => a.y-b.y).forEach(o => o.f());
groundFog(); shafts();
grade(S.grade);
lights();
fog();
rain();
dof();
vignetteAndGrain();
}
if (!window.LAB) { renderAll(); document.title = 'done'; }
</script></body></html>
