<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0c0a12}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
// Concept mockup: a close in-game camera frame of THE CROWN — the cloud meadow at the top of Day 4.
// Landscape (game camera aspect). Shaded cut-paper technique from src/render/style.js. Friends are placeholders.
const W = 1280, H = 820, K = 2;
const cv = document.getElementById('c'); cv.width = W*K; cv.height = H*K;
const g = cv.getContext('2d'); g.scale(K,K);
const LIGHT = { x:-0.72, y:-0.69 };
const hexRGB = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const mixHex = (a,b,t)=>{const A=hexRGB(a),B=hexRGB(b);t=Math.max(0,Math.min(1,t));return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');};
const lit=(base,t)=> t>=0 ? mixHex(base,'#ffe2a6',t*0.5) : mixHex(base,'#4a4c86',-t*0.42);
let SPRITE=false;
function volume(x,y,rx,ry,base){ const r=Math.max(rx,ry); const gr=g.createRadialGradient(x+LIGHT.x*rx*0.42,y+LIGHT.y*ry*0.42-ry*0.1,r*0.04,x-LIGHT.x*rx*0.18,y-LIGHT.y*ry*0.18+ry*0.08,r*1.15);
  gr.addColorStop(0,lit(base,1)); gr.addColorStop(0.5,base); gr.addColorStop(1,lit(base,-1)); return gr; }
const isHex=c=>typeof c==='string'&&c.length===7&&c[0]==='#';
function circ(x,y,r,fill){ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fillStyle=(SPRITE&&isHex(fill)&&r>=2.5)?volume(x,y,r,r,fill):fill; g.fill(); }
function ell(x,y,rx,ry,fill){ g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fillStyle=(SPRITE&&isHex(fill)&&Math.min(rx,ry)>=2.5)?volume(x,y,rx,ry,fill):fill; g.fill(); }
function shadow(x,y,rx,h=rx*2.2){ g.save(); g.globalAlpha=0.3; let gr=g.createRadialGradient(x,y,0,x,y,rx*1.4); gr.addColorStop(0,'rgba(26,31,23,.9)'); gr.addColorStop(1,'rgba(26,31,23,0)'); g.fillStyle=gr; g.beginPath(); g.ellipse(x,y,rx*1.4,rx*0.6,0,0,Math.PI*2); g.fill();
  const len=h*0.9; g.globalAlpha=0.24; g.translate(x+0.95*len*0.5,y+0.31*len*0.5); g.rotate(0.31); gr=g.createRadialGradient(0,0,0,0,0,len*0.6); gr.addColorStop(0,'rgba(43,36,82,.9)'); gr.addColorStop(1,'rgba(43,36,82,0)'); g.fillStyle=gr; g.beginPath(); g.ellipse(0,0,(len+rx*2.4)/2,rx*0.62,0,0,Math.PI*2); g.fill(); g.restore(); }
function sprite(fn){ SPRITE=true; fn(); SPRITE=false; }
const smoothPts=(pts,steps=12)=>{const n=pts.length,out=[],mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];for(let i=0;i<n;i++){const p0=mid(pts[(i-1+n)%n],pts[i]),c=pts[i],p1=mid(pts[i],pts[(i+1)%n]);for(let k=0;k<steps;k++){const t=k/steps,u=1-t;out.push([u*u*p0[0]+2*u*t*c[0]+t*t*p1[0],u*u*p0[1]+2*u*t*c[1]+t*t*p1[1]]);}}return out;};
function polyPath(poly,dx=0,dy=0){ g.beginPath(); poly.forEach(([x,y],i)=> i?g.lineTo(x+dx,y+dy):g.moveTo(x+dx,y+dy)); g.closePath(); }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// ---- warm sky, soft sun ----
let gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#aed6e6'); gr.addColorStop(0.45,'#dfe9cf'); gr.addColorStop(0.75,'#f6e8c6'); gr.addColorStop(1,'#f3dcb8');
g.fillStyle=gr; g.fillRect(0,0,W,H);
gr=g.createRadialGradient(250,150,20,250,150,460); gr.addColorStop(0,'rgba(255,248,220,.9)'); gr.addColorStop(1,'rgba(255,248,220,0)'); g.fillStyle=gr; g.fillRect(0,0,W,600);

// ---- distant isles poking through a far cloud sea (the cove & Puffin Isle, far below) ----
function farIsle(x,y,s,grassy){ polyPath(smoothPts([[x-150*s,y+12],[x-80*s,y-26*s],[x+10*s,y-40*s],[x+90*s,y-24*s],[x+150*s,y+12]]));
  g.fillStyle='#9fb8b9'; g.fill(); if(grassy){ polyPath(smoothPts([[x-110*s,y-6],[x-30*s,y-30*s],[x+60*s,y-26*s],[x+110*s,y-2*s]])); g.fillStyle='#8fae86'; g.fill(); } }
farIsle(360,430,0.7,1); farIsle(560,452,0.5,1); farIsle(1000,430,0.8,1);
// a little lighthouse on the far isle
g.fillStyle='rgba(251,248,239,.9)'; g.fillRect(1006,392,7,26); g.fillStyle='rgba(216,87,58,.9)'; g.fillRect(1006,398,7,6);

// ---- the sea of clouds filling the lower-mid band ----
function cloudBank(cy,scale,col,a){ const R=rng(Math.round(cy)); g.save(); g.globalAlpha=a;
  for(let i=0;i<26;i++){ const x=R()*W, y=cy+(R()-0.5)*70*scale, w=(90+R()*180)*scale, h=w*(0.34+R()*0.18);
    g.fillStyle=col; g.beginPath(); g.ellipse(x,y,w,h,0,0,Math.PI*2); g.fill(); } g.restore(); }
cloudBank(470,1,'#e9efeb',0.8); cloudBank(520,1.3,'#ffffff',0.92); cloudBank(560,1.6,'#f4f7f4',1);

// ---- the crown's grassy ground in the foreground (edge drops to the clouds) ----
const EDGE = smoothPts([[-40,560],[120,520],[300,540],[520,516],[760,528],[980,512],[1180,540],[1320,560],[1320,860],[-40,860]]);
polyPath(EDGE); g.fillStyle='#7aa35a'; g.fill();   // shaded grass band under the lip
const GROUND = smoothPts([[-40,600],[160,566],[360,586],[560,560],[800,576],[1040,556],[1240,588],[1320,610],[1320,900],[-40,900]]);
polyPath(GROUND); g.fillStyle='#9ec775'; g.fill();
// lip highlight
g.save(); polyPath(GROUND); g.clip();
gr=g.createLinearGradient(0,556,0,720); gr.addColorStop(0,'rgba(255,248,200,.5)'); gr.addColorStop(1,'rgba(255,248,200,0)'); g.fillStyle=gr; g.fillRect(0,556,W,180);
// rolling light
gr=g.createRadialGradient(560,660,30,560,700,520); gr.addColorStop(0,'rgba(255,246,196,.4)'); gr.addColorStop(1,'rgba(255,246,196,0)'); g.fillStyle=gr; g.fillRect(0,560,W,340);
const Rg=rng(7); g.lineCap='round';
for(let i=0;i<420;i++){ const x=Rg()*W,y=600+Rg()*300; g.strokeStyle=Rg()>0.5?'#8fbf68':'#a7cf7e'; g.lineWidth=2.6; g.beginPath(); g.moveTo(x,y); g.lineTo(x-3,y-10); g.moveTo(x+4,y); g.lineTo(x+6,y-9); g.stroke(); }
g.restore();
// tuft fringe along the cliff lip
g.strokeStyle='#86b064'; g.lineWidth=3;
for(let x=-20;x<W;x+=22){ const y=560+Math.sin(x*0.02)*10; g.beginPath(); g.moveTo(x,y+6); g.lineTo(x-4,y-8); g.moveTo(x+5,y+6); g.lineTo(x+8,y-5); g.stroke(); }

// ---- sea-thrift flowers ----
function thrift(x,y,s){ sprite(()=>{ g.fillStyle='#6f9e55'; g.beginPath(); g.ellipse(x,y,30*s,12*s,0,Math.PI,0); g.fill(); }); const R=rng(Math.round(x*7+y)); g.strokeStyle='#5f8a4c'; g.lineWidth=1.8;
  for(let i=0;i<9;i++){ const px=x+(R()-0.5)*52*s,py=y-12*s-R()*22*s; g.beginPath(); g.moveTo(px,py+4); g.lineTo(x+(px-x)*0.4,y); g.stroke(); circ(px,py,5.5*s,i%3?'#f2a3c4':'#e886b0'); } }
[[200,720,1],[420,760,0.9],[900,700,1],[1120,740,0.9],[640,800,1.1],[1040,820,0.8]].forEach(([x,y,s])=>thrift(x,y,s));
// a lookout cairn
(function cairn(){ const x=1150,y=640; shadow(x,y+6,30); sprite(()=>{ ell(x,y-6,26,16,'#a39a8a'); ell(x-2,y-22,20,13,'#b1a898'); ell(x,y-36,14,10,'#968d7f'); ell(x+1,y-48,9,7,'#a39a8a'); }); })();
// a couple of wind-bent pines at the crown edge
function pine(x,y,s){ shadow(x,y+4,26*s); sprite(()=>{ g.save(); g.translate(x,y); g.rotate(0.06); g.fillStyle='#8c6a4d'; g.fillRect(-5*s,-18*s,10*s,20*s);
  [['#4f8250',0,46,34],['#5d8f5a',-26,38,28],['#6c9c62',-50,28,22]].forEach(([c,dy,w,h])=>{ g.fillStyle=c; g.beginPath(); g.moveTo(-w*s,(dy-12)*s); g.quadraticCurveTo(0,(dy-4)*s,w*s,(dy-12)*s); g.lineTo(0,(dy-12-h*1.6)*s); g.closePath(); g.fill(); }); g.restore(); }); }
pine(90,700,1.1); pine(1250,720,1);

// ---- characters ----
function pip(x,y){ shadow(x,y+2,22); sprite(()=>{ g.save(); g.translate(x,y);
  g.fillStyle='#8a5a3c'; g.beginPath(); g.moveTo(-16,-9); g.quadraticCurveTo(-38,-4,-36,7); g.quadraticCurveTo(-27,0,-11,0); g.fill();
  ell(0,-18,18,20,'#9b6845'); ell(3,-15,10,13,'#e9cfa8'); circ(7,-45,16,'#9b6845'); ell(15,-40,9,7,'#e9cfa8');
  circ(-4,-56,5,'#9b6845'); circ(15,-58,5,'#9b6845'); circ(-4,-56,2,'#6e4630'); circ(15,-58,2,'#6e4630');
  circ(10,-48,2.8,'#34433a'); circ(20,-42,2.6,'#3b2a22');
  g.fillStyle='#f4b85a'; g.beginPath(); g.roundRect(-9,-33,24,7,3); g.fill(); g.beginPath(); g.moveTo(-7,-30); g.lineTo(-16,-18); g.lineTo(-9,-18); g.closePath(); g.fill(); g.restore(); }); }
function stag(x,y){ shadow(x,y+2,34); sprite(()=>{ g.save(); g.translate(x,y);
  g.strokeStyle='#b58a5a'; g.lineWidth=8; g.lineCap='round'; [[-20],[-9],[9],[20]].forEach(([dx])=>{g.beginPath();g.moveTo(dx,-38);g.lineTo(dx,0);g.stroke();});
  ell(0,-50,38,24,'#b58a5a'); ell(-8,-48,20,14,'#e0c79e'); circ(33,-78,19,'#b58a5a'); ell(39,-74,10,8,'#efdcc0');
  g.strokeStyle='#d8c9a8'; g.lineWidth=5; g.beginPath(); g.moveTo(25,-94); g.lineTo(15,-122); g.moveTo(20,-106); g.lineTo(4,-114); g.moveTo(41,-94); g.lineTo(51,-124); g.moveTo(46,-106); g.lineTo(62,-114); g.stroke();
  ell(23,-96,5,9,'#b58a5a'); ell(43,-96,5,9,'#b58a5a'); circ(37,-80,3,'#34433a'); circ(45,-72,2.4,'#3b2a22'); g.restore(); }); }
function lark(x,y,fl){ sprite(()=>{ g.save(); g.translate(x,y);
  ell(0,0,12,9,'#b79a6e'); ell(2,2,7,6,'#efe3cf'); circ(10,-6,7,'#b79a6e');
  g.fillStyle='#8a6c48'; g.beginPath(); g.moveTo(16,-6); g.lineTo(24,-4); g.lineTo(16,-1); g.fill();
  g.fillStyle='#a88a5e'; g.beginPath(); g.moveTo(-2,-5); g.quadraticCurveTo(-18,-16-fl,-26,-9); g.quadraticCurveTo(-14,-4,-5,-2); g.fill();
  circ(11,-7,1.6,'#34433a'); g.restore(); }); }
// a few drifting thistle seeds (Lark's game: catch them in the wind)
function seed(x,y){ g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=1.4; for(let i=0;i<8;i++){const a=i/8*Math.PI*2; g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*7,y+Math.sin(a)*7); g.stroke();} circ(x,y,2,'#efe3cf'); }
seed(560,360); seed(700,300); seed(820,420); seed(480,280);

stag(820,700); pip(600,740); lark(690,420,3);

// ---- a couple of soaring puffins/gulls over the clouds ----
function gull(x,y){ g.strokeStyle='#fffaf0'; g.lineWidth=3.5; g.lineCap='round'; g.beginPath(); g.moveTo(x-16,y-5); g.quadraticCurveTo(x-8,y+2,x,y-2); g.quadraticCurveTo(x+8,y+2,x+16,y-5); g.stroke(); }
gull(300,250); gull(960,220); gull(1120,300);

// ---- grade + vignette ----
g.save(); g.globalCompositeOperation='soft-light'; g.globalAlpha=0.26; g.fillStyle='#ff9a48'; g.fillRect(0,0,W,H);
g.globalCompositeOperation='multiply'; g.globalAlpha=0.15; g.fillStyle='#fbe0c0'; g.fillRect(0,0,W,H); g.restore();
gr=g.createRadialGradient(W/2,H/2,H*0.42,W/2,H/2,H*0.95); gr.addColorStop(0,'rgba(52,67,58,0)'); gr.addColorStop(1,'rgba(52,67,58,.2)'); g.fillStyle=gr; g.fillRect(0,0,W,H);

// ---- labels ----
function label(x,y,text,tail){ g.font='700 19px system-ui,sans-serif'; const w=g.measureText(text).width+24;
  g.fillStyle='rgba(255,250,240,.95)'; g.beginPath(); g.roundRect(x-w/2,y-16,w,30,15); g.fill();
  if(tail){ g.beginPath(); g.moveTo(x-6,y+13); g.lineTo(x,y+22); g.lineTo(x+6,y+13); g.fill(); }
  g.fillStyle='#34433a'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,x,y); }
label(640,56,'The Crown — in-game camera view (cozy, above the clouds)');
label(820,590,'Willow the stag',1); label(600,640,'Pip',1); label(690,470,'Lark + drifting thistle seeds',1);
label(760,436,'',0);
label(1000,360,'the cove & Puffin Isle, far below',0);
</script></body></html>
